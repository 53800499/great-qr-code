<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marraine / Parrain d'Espoir · Cœur en Rose</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .page-wrapper {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .page-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      background: #1a1e27;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 12px 20px;
    }
    .page-title-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .page-badge {
      background: #12100f;
      color: #fff;
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .page-title {
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
    }
    .page-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn-nav {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #cbd5e1;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn-nav:hover {
      background: rgba(244, 63, 94, 0.2);
      border-color: #f43f5e;
      color: #fff;
    }
    .btn-nav.primary {
      background: #f43f5e;
      border-color: #f43f5e;
      color: #fff;
      font-weight: 600;
    }
    .slide-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .slide-section-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #94a3b8;
      font-weight: 600;
    }
    .slide-box {
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: #000;
    }
    .slide-box img {
      width: 100%;
      height: auto;
      display: block;
    }
    @media print {
      body {
        background: #fff !important;
        padding: 0 !important;
      }
      .page-header-bar {
        display: none !important;
      }
      .slide-box {
        border: none !important;
        box-shadow: none !important;
        page-break-after: always;
      }
    }
  </style>
</head>
<body>

  <div class="page-wrapper">

</body>
